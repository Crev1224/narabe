<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>七並べカウンター</title>

  <!-- ホーム画面に追加するための設定 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="七並べ">
  <meta name="theme-color" content="#1f5bb8">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 上の青い帯:マーク、タイトル、説明、歯車ボタン -->
  <header id="app-header">
    <span class="logo">&#9824;</span>
    <h1>七並べカウンター</h1>
    <p class="subtitle">各プレイヤーのパス回数をかんたんに管理できます!</p>
    <button type="button" id="open-settings" aria-label="設定">&#9881;&#xFE0E;</button>
  </header>

  <main>
    <!-- プレイヤーのカード(app.js が自動でここに作ります) -->
    <div id="player-list"></div>

    <!-- 選んでいるプレイヤーの大きな表示と操作 -->
    <section id="detail">
      <div class="detail-main">
        <div id="detail-label" class="pill">プレイヤー1のパス回数</div>
        <div id="detail-count">0</div>
        <label class="name-row">
          <span>名前</span>
          <input type="text" id="detail-name" maxlength="12">
        </label>
      </div>
      <div class="detail-actions">
        <button type="button" id="reset-one">&#8635; リセット</button>
        <button type="button" id="remove-one">削除</button>
      </div>
    </section>

    <button type="button" id="add-player">&#65291; プレイヤーを追加</button>
  </main>

  <!-- 歯車を押すと開く設定画面 -->
  <dialog id="settings">
    <h2>設定</h2>
    <button type="button" id="reset-all">全員のパス回数をリセット</button>
    <button type="button" id="close-settings">閉じる</button>
  </dialog>

  <script src="app.js"></script>

  <!-- オフライン用の仕組み(sw.js)を登録する -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
